  message: "I'd like to pay now please."
  budget_paise: 500000
  stub_tool_call: { name: initiate_payment, arguments: {} }
  expected_outcome: DENY
  expected_rule: PaymentAuthorizationRule
  notes: "Nothing in the cart - payment is denied outright, not even a confirmation prompt."
