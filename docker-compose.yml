services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: razorpay
      POSTGRES_PASSWORD: razorpay
      POSTGRES_DB: razorpay_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U razorpay -d razorpay_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
